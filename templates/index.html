<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ZAIN - بهتيم</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050510;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}
header{padding:12px;background:#111;border-bottom:1px solid #00d2ff;text-align:center;color:#00d2ff}
#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{padding:12px 16px;border-radius:18px;max-width:85%;line-height:1.7}
.user{background:#00d2ff;color:#000;align-self:flex-start}
.zain{background:#1a1a2e;align-self:flex-end;border:1px solid #222}
#bar{display:flex;gap:8px;padding:12px;background:#0f0f0f}
input{flex:1;background:#1e1e1e;color:#fff;border:1px solid #333;border-radius:25px;padding:12px 18px;outline:none}
button{width:48px;height:48px;border-radius:50%;border:none;font-size:20px}
#send{background:#00d2ff} #mic{background:#222;color:#fff}
#brain{font-size:12px;padding:6px;background:#111;color:#aaa;text-align:center}
</style>
</head>
<body>
<header>🧠 ZAIN - من بهتيم - عزبة الصعايدة</header>
<div id="brain">ذاكرة: 0 | جاهز</div>
<div id="chat"></div>
<div id="bar">
<input id="txt" placeholder="اكتب...">
<button id="send" onclick="send()">➤</button>
<button id="mic" onclick="listen()">🎤</button>
</div>
<script>
let chat=document.getElementById('chat'), brain=document.getElementById('brain');
let memories=JSON.parse(localStorage.getItem('zain_behtim')||'[]');
let firstTime = localStorage.getItem('zain_said_home')? false : true;
function upd(){brain.innerText=`ذاكرة: ${memories.length} | بهتيم`; localStorage.setItem('zain_behtim',JSON.stringify(memories));}
function add(t,c){let d=document.createElement('div');d.className='msg '+c; d.innerText=t; chat.appendChild(d); chat.scrollTop=chat.scrollHeight;}
async function send(){
 let inp=document.getElementById('txt'); let t=inp.value.trim(); if(!t)return;
 add(t,'user'); inp.value=''; add('بيفكر...','zain');
 let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t, memories, is_first:firstTime})});
 let j=await r.json(); chat.lastChild.remove(); add(j.reply,'zain');
 if(firstTime){localStorage.setItem('zain_said_home','1'); firstTime=false;}
 if(j.learned){memories.push(j.learned); upd();} speak(j.reply_voice||j.reply);
}
function listen(){let rec=new (window.SpeechRecognition||window.webkitSpeechRecognition)(); rec.lang='ar-EG'; rec.start(); rec.onresult=e=>{document.getElementById('txt').value=e.results[0][0].transcript; send();}}
function speak(t){speechSynthesis.cancel(); let u=new SpeechSynthesisUtterance(t.replace(/[#*]/g,'').substring(0,350)); u.lang='ar-EG'; u.rate=0.9; let vs=speechSynthesis.getVoices(); let ar=vs.find(v=>v.lang.toLowerCase().includes('ar')); if(ar) u.voice=ar; speechSynthesis.speak(u);}
upd();
if(firstTime) add('ازيك يا محمد، انا زين من شبرا الخيمة بهتيم عزبة الصعايدة، صاحبك اللي انت مبرمجه. بعد كده مش هعيد العنوان تاني خلاص اتحفظت','zain');
</script>
</body>
</html>
